[workspace]
resolver = "3"
members = [
    "example_contracts/bank", 
    "example_contracts/fake", 
    "example_contracts/vote", 
    "denali", 
    "macros"
]

[workspace.dependencies]
async-trait = "0.1.88"
axum = "0.8.4"
derive_more = { version = "2.0.1", features = ["as_ref"] }
futures = "0.3.31"
hex = "0.4.3"
libloading = "0.8.8"
log = "0.4.27"
notify = "8.0.0"
quote = "1.0.40"
rocksdb = "0.23.0"
rust_decimal = { version = "1.37.1", features = ["macros"] }
semver = "1.0.26"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
sha2 = "0.10.9"
syn = "2.0.104"
tempfile = "3.20.0"
tokio = { version = "1.45.1", features = ["macros", "rt-multi-thread", "sync", "time"] }
