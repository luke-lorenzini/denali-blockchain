[workspace]
resolver = "3"
# members = ["contracts/bank", "contracts/vote", "denali"]
members = ["denali"]

[workspace.dependencies]
derive_more = { version = "2.0.1", features = ["as_ref"] }
hex = "0.4.3"
log = "0.4.27"
rust_decimal = { version = "1.37.1", features = ["macros"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
sha2 = "0.10.9"
